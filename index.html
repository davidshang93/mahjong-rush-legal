<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Mahjong Rush 3D Match Dim Sum</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#fbfaf7; --fg:#1f2328; --muted:#5b6370; --line:#e4e1da; --accent:#2c56c9; --card:#f2efe8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101216; --fg:#e6e8ec; --muted:#9ba3b1; --line:#2a2e37; --accent:#93b1ff; --card:#181b22; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;overflow-wrap:break-word}
main{max-width:720px;margin:0 auto;padding:24px 16px 72px}
section{scroll-margin-top:16px}
nav.lang{display:flex;gap:8px;justify-content:flex-end;font-size:14px;margin:0 0 28px}
nav.lang a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px}
nav.lang a:hover,nav.lang a:focus-visible{color:var(--fg);border-color:var(--muted)}
.eyebrow{color:var(--muted);font-size:14px;margin:0 0 6px}
h1{font-size:1.9rem;line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:14px;margin:0 0 24px}
h2{font-size:1.12rem;line-height:1.4;margin:2.1em 0 .55em}
p,ul{margin:0 0 1em}
ul{padding-left:1.3em}
li{margin:.35em 0}
a{color:var(--accent);text-underline-offset:2px}
strong{font-weight:600}
.summary{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px 6px;margin:0 0 8px}
.summary p.k{font-weight:600;margin:0 0 .4em}
.note{color:var(--muted);font-size:14px}
hr{border:0;border-top:1px solid var(--line);margin:64px 0 40px}
section[lang^="zh"]{line-height:1.85}
section[lang^="zh"] h1{letter-spacing:0}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
<section id="en" lang="en">
<img src="icon-512.png" alt="" width="120" height="120" style="border-radius:26px;display:block;margin:0 0 20px">
<p class="eyebrow">East Coast Tech Inc.</p>
<h1>Mahjong Rush 3D Match Dim Sum</h1>
<p class="meta">A cozy 3D mahjong tile-matching game for iPhone. Contact: <a href="mailto:contact@eastbigtech.com">contact@eastbigtech.com</a></p>
<ul>
<li><a href="privacy.html">Privacy Policy</a></li>
<li><a href="support.html">Support</a></li>
</ul>
</section>
</main>
</body>
</html>
